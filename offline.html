<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بلا اتصال — حصن الزواج</title>
<link rel="stylesheet" href="app.css">
<meta name="theme-color" content="#1C3834">
</head>
<body>
<main class="shell">
  <header class="brand">
    <!-- ⚠️ العلامة الشفّافة لا أيقونة التطبيق: الأيقونة تحمل خلفيةً
         فاتحة مطلوبةً على شاشة الهاتف، وهي داخل الصفحة مربّعٌ فاتح
         يقطع النمط الداكن. -->
    <img src="brand/logo_mark.png" alt="" width="61" height="90" class="brand__mark">
    <h1 class="brand__name">لا يوجد اتصال</h1>
    <p class="brand__line">الصفحة التي طلبتها تحتاج شبكة</p>
  </header>
  <section class="card">
    <p class="card__body">
      تحقّق من اتصالك ثم أعد المحاولة. وما سبق تحميله يبقى متاحاً.
    </p>
  </section>
  <div class="actions">
    <a class="btn btn--primary" href=".">العودة إلى الصفحة الرئيسية</a>
  </div>
</main>
</body>
</html>
