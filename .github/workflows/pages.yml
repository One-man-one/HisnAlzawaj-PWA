# نشر الواجهة على GitHub Pages عند كل دفعة إلى main.
#
# ⚠️ **ولماذا سير عملٍ لا إعدادٌ من اللوحة:** تفعيل Pages من اللوحة
# قرارٌ يسكن إعدادات المستودع لا المستودع نفسه — فمن يستنسخ هذا
# المشروع لا يرى منه شيئاً، ومن ينقله إلى حسابٍ آخر يجد موقعاً لا
# يُنشر بلا أن يدلّه ملفٌّ واحد على السبب. الملفّ هنا هو الإعداد.
#
# ⚠️ **و‎enablement: true‎ أدناه لا يُغني عن تفعيلٍ يدويّ أوّل مرّة —
# جُرّب فسقط.** التشغيل الأوّل انتهى بـ:
#
#     Create Pages site failed:
#     Resource not accessible by integration
#
# لأن إنشاء **موقع** Pages من الصفر صلاحيةُ مالكٍ لا تُمنح لتوكن سير
# العمل مهما أُعلن له من ‎permissions‎. فالمالك يفتحها مرّةً واحدة من
# Settings ← Pages ← Source ← **GitHub Actions**، وبعدها لا تُعاد.
#
# ✅ ويبقى السطر لأنه يعمل فيما هو له: بعد التفعيل يقرأ الموقع القائم
# فلا يحاول إنشاءه، ويُغني عن خطوةٍ يدويّة في أي نسخةٍ من هذا
# المستودع يكون الموقع فيها مفعّلاً سلفاً.
#
# ⚠️ **وGitHub Pages لا يعمل على مستودعٍ خاصّ في الخطة المجانية** —
# وهو الجدار الحقيقيّ الذي سبق ذلك الخطأ. فمن رأى هذا الفشل فليفحص
# ظهور المستودع قبل أن يفحص الصلاحيات.

name: نشر الواجهة

on:
  push:
    branches: [main]

  # زرّ تشغيل يدويّ — إعادةُ نشرٍ بلا دفعةٍ جديدة.
  workflow_dispatch:

# ⚠️ الصلاحيات الثلاث كلُّها لازمة، وحذفُ واحدةٍ يُسقط التشغيل بخطأ
# صلاحيات لا بخطأ نشر: ‎pages‎ للكتابة، و‎id-token‎ لأن ‎deploy-pages‎
# يوقّع الطلب بـOIDC، و‎contents‎ للقراءة وحدها.
permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ ‎cancel-in-progress: false‎ بقرار: إلغاء نشرٍ في منتصفه يترك
# الموقع على نسخةٍ نصفَ منشورة.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: بناء ونشر
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ التاريخُ كاملاً لا آخرُ لقطة: حارسُ VERSION أدناه يقارن
          # بالدفعة السابقة (‎github.event.before‎)، وبلا تاريخٍ لا يجدها
          # فيتخطّى — ويصير حارساً لا يحرس. والمستودع صغير.
          fetch-depth: 0

      # ⚠️ **حارسُ VERSION — ما يُسقط النشرَ حين يُنسى أخطرُ سطرٍ في
      # المستودع** (الشرح في رأس ‎sw.js‎ وفي CLAUDE.md): ملفٌّ من ‎SHELL‎
      # تغيّر منذ الدفعة السابقة و‎VERSION‎ لم يتغيّر = كلُّ مثبِّتٍ عالقٌ
      # على القديم إلى الأبد. والقائمة تُقرأ من ‎sw.js‎ نفسه لا تُنسخ هنا.
      # ✅ وحين لا تاريخَ يُقارَن به (تشغيلٌ يدويّ، فرعٌ جديد، دفعٌ قسريّ)
      # يتخطّى بإشعارٍ لا بفشل: حارسُ نسيانٍ لا حاجزُ نشر.
      - name: حارس VERSION في sw.js
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "push" || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::لا دفعةَ سابقةً تُقارَن بها — حارس VERSION يتخطّى."
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          shell=$(sed -n '/^const SHELL = \[/,/^\];/p' sw.js \
                  | grep -o "'[^']*'" | tr -d "'" | grep -v '^\.$' || true)
          touched=$(grep -Fx -f <(printf '%s\n' "$shell") <<<"$changed" || true)
          if [[ -z "$touched" ]]; then
            echo "لا ملفّ من SHELL تغيّر — لا حاجة لرفع VERSION."
            exit 0
          fi
          old=$(git show "$BEFORE:sw.js" 2>/dev/null | grep -m1 '^const VERSION = ' || true)
          new=$(grep -m1 '^const VERSION = ' sw.js || true)
          if [[ -z "$old" || -z "$new" ]]; then
            echo "::notice::تعذّر قراءة VERSION في أحد الطرفين — الحارس يتخطّى."
            exit 0
          fi
          if [[ "$old" == "$new" ]]; then
            echo "::error file=sw.js::تغيّر من SHELL: $(echo "$touched" | tr '\n' ' ')— و$new لم يتغيّر. ارفع VERSION ثم ادفع ثانيةً."
            exit 1
          fi
          echo "VERSION رُفع ($old ← $new) — المثبِّتون سيرون الجديد."

      - name: تهيئة Pages (وتفعيلها إن لم تكن مفعّلة)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ⚠️ المستودع كلّه يُرفع لأنه ساكنٌ بلا خطوة بناء — لا ‎dist/‎
      # هنا ولا شيء يُولَّد وقت النشر. والأيقونات مرفوعةٌ في المستودع
      # لهذا السبب بعينه.
      - name: تجميع الملفّات
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
